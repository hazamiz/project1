<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #12020e;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 460px;
      text-align: center;
    }

    .main-title {
      font-size: 26px;
      font-weight: bold;
      color: #d4af37;
      margin-bottom: 25px;
    }

    .card-container {
      background: #1a0415;
      border: 1px solid #d4af37;
      border-radius: 16px;
      padding: 35px 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    /* مدخلات البيانات */
    .form-group {
      margin-bottom: 20px;
      text-align: right;
    }

    .form-group input {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #d4af37;
      background: #260720;
      color: #ffffff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s;
    }

    .form-group input:focus {
      border-color: #ffffff;
    }

    /* رابط نسيت كلمة المرور */
    .forgot-link-container {
      text-align: left;
      margin-top: -10px;
      margin-bottom: 20px;
    }

    .forgot-link {
      font-size: 13px;
      color: #d4af37;
      text-decoration: none;
      transition: opacity 0.3s;
    }

    .forgot-link:hover {
      text-decoration: underline;
      opacity: 0.8;
    }

    /* الأزرار */
    .btn-container {
      display: flex;
      gap: 15px;
      margin-top: 10px;
    }

    .btn-submit {
      flex: 2;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #d4af37;
      background: transparent;
      color: #d4af37;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-submit:hover {
      background: #d4af37;
      color: #12020e;
    }

    .btn-reset {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(212, 175, 55, 0.5);
      background: transparent;
      color: #cccccc;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-reset:hover {
      border-color: #d4af37;
      color: #ffffff;
    }

    /* شريط الانتقال لصفحة إنشاء الحساب الخارجيّة */
    .register-footer {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid rgba(212, 175, 55, 0.2);
      font-size: 14px;
      color: #cccccc;
    }

    .register-link {
      color: #d4af37;
      text-decoration: none;
      font-weight: bold;
      margin-right: 5px;
    }

    .register-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <h1 class="main-title">لتسجيل الدخول املأ الحقول أدناه :</h1>

    <div class="card-container">
      <form id="loginForm">
        
        <!-- البريد الإلكتروني -->
        <div class="form-group">
          <input type="email" placeholder="ادخل البريد الالكتروني" required>
        </div>

        <!-- كلمة المرور -->
        <div class="form-group">
          <input type="password" placeholder="ادخل كلمة المرور" required>
        </div>

        <!-- خيار نسيت كلمة المرور -->
        <div class="forgot-link-container">
          <a href="forgot-password.html" class="forgot-link">هل نسيت كلمة المرور؟</a>
        </div>

        <!-- أزرار الإرسال والإعادة -->
        <div class="btn-container">
          <button type="submit" class="btn-submit">تسجيل الدخول</button>
          <button type="reset" class="btn-reset">إعادة ضبط</button>
        </div>

      </form>

      <!-- الانتقال لصفحة إنشاء الحساب الخاصة بك -->
      <div class="register-footer">
        إذا لم يكن لديك حساب؟ 
        <a href="logen-in.html" class="register-link">اضغط هنا لإنشاء حساب</a>
      </div>
    </div>
  </div>

</body>
</html>
