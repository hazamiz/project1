 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/logen-in.css">
    <title>تسجيل الدخول</title>
 </head>
 <body>
    
    <div class="tit">
        
    <h1>: لانشاء حساب ادخل البيانات التالية</h1>
    </div>
    <div class="about-log">
    <form id="sign-in-form">
      
        <input type="text" id="username" placeholder="ادخل الاسم الكامل " required>

      
        <input type="email" id="email" placeholder="ادخل البريد الالكتلروني" required>

        
        <input type="password"  id="password" placeholder="اخل كلمة المرور  " required>



      
         <select name="" id="iktar" required >
            <option selected disabled> اختر مكان الاقامة</option>
         <option value="syria">سوريا</option>
         <option value="qatar">قطر</option>
         <option value="egypt">مصر</option>
         <option value="the UAE">الامارات</option>
         <option value="saudi Arabia">السعودية</option>

         </select>
    
        <button type="submit" id="submi-btn">تسجيل الدخول</button>
        <button type="reset" id="reset-btn">اعادة ضبط</button>

    </form>
    </div>


    <script src="js/logen-in.js"></script>
 </body>
 </html>
